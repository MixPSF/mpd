  window.addEventListener('error', function (e) {
    var b = document.getElementById('sync-status');
    if (b) { b.textContent = 'ОШИБКА СКРИПТА'; b.className = 'text-xs px-2 py-1 bg-red-600 rounded'; }
    var m = document.getElementById('err-box');
    if (m) { m.style.display = 'block'; m.textContent = (e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''); }
  });
</script>

  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; padding-bottom: 72px; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
  body.dark { background: #0b1220; color: #e2e8f0; }
  body.dark .bg-white { background: #1e293b; } body.dark .bg-gray-100 { background: #0b1220; }
  body.dark .bg-gray-200 { background: #334155; } body.dark .bg-gray-300 { background: #475569; color: #e2e8f0; }
  body.dark .bg-blue-100 { background: #1e3a8a; } body.dark .bg-red-100 { background: #450a0a; }
  body.dark .text-slate-800, body.dark .text-slate-700, body.dark .text-gray-800, body.dark .text-gray-700 { color: #e2e8f0; }
  body.dark .text-slate-600, body.dark .text-slate-500, body.dark .text-gray-600, body.dark .text-gray-500, body.dark .text-slate-400, body.dark .text-gray-400 { color: #94a3b8; }
  body.dark .text-red-800 { color: #fecaca; }
  body.dark .bg-red-50 { background: #3a1217; } body.dark .border-red-200 { border-color: #7f1d1d; } body.dark .text-red-600 { color: #fca5a5; }

  @keyframes alertflash { 0%,100% { background: rgba(185,28,28,.96); } 50% { background: rgba(239,68,68,.96); } } #alert { animation: alertflash 1s infinite; }

  #chat-msgs { flex: 1; overflow-y: auto; width: 100%; max-width: 28rem; margin: 0 auto; }

<body class="bg-gray-100 font-sans min-h-screen">
<header id="hdrbar" class="bg-slate-800 text-white p-3 sticky top-0 z-10 shadow-md flex justify-between items-center gap-2">
  <h1 class="font-bold text-base truncate" id="hdr">Цех МПД / УЗК</h1>
  <div class="flex items-center gap-2 shrink-0">
    <button id="theme" data-act="theme" class="text-base px-2 py-1 bg-slate-600 rounded">🌓</button>
    <button id="online" data-act="online" class="hidden text-xs px-2 py-1 bg-slate-600 rounded">👥 0</button>
    <span id="sync-status" class="text-xs px-2 py-1 bg-yellow-600 rounded">Подключение...</span>
  </div>
</header>
<div id="err-box" style="display:none" class="m-3 p-3 bg-red-100 text-red-800 text-sm rounded break-all"></div>

<main id="app" class="hidden p-2 max-w-md mx-auto">
  <div id="v-list" class="space-y-1.5"></div><div id="v-sort" class="hidden space-y-3"></div>
  <div id="v-stat" class="hidden space-y-3"></div><div id="v-arch" class="hidden space-y-3"></div><div id="v-chat" class="hidden"></div><div id="v-set" class="hidden space-y-3"></div><div id="v-admin" class="hidden space-y-3"></div><div id="v-games" class="hidden space-y-3"></div><div id="v-cal" class="hidden space-y-3"></div>
</main>
<nav id="nav" class="hidden fixed bottom-0 inset-x-0 bg-slate-800 text-white flex overflow-x-auto text-[11px] text-center" style="padding-bottom:env(safe-area-inset-bottom,0)"></nav>
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-3"></div>
<div id="toast" class="hidden fixed bottom-20 inset-x-4 z-50 bg-slate-900 text-white text-sm p-3 rounded-lg text-center"></div>
<div id="alert" class="hidden fixed inset-0 z-[100] flex flex-col items-center justify-center text-center text-white p-6">
  <button data-act="alertx" aria-label="Закрыть" class="absolute top-3 right-4 text-5xl leading-none p-2">✕</button>
  <div class="text-7xl mb-4">🚨</div><div class="text-3xl font-black leading-tight">Дніпро оголошена повітряна тривога!</div><div id="alert-sub" class="mt-3 text-lg opacity-90"></div>
</div>

<script>
// ===== Константы (В, Н, П — кириллица; N — латиница) =====
const V = '\u0412', H = '\u041d', P = '\u041f', L = [V, H, P];
const CY = ['-', 'N', H, V, 'ЗАК'];
const RA = '\u0420/\u0410', OBR = '\u041e\u0411\u0420';
const MC = { [RA]: 'bg-red-600 text-white', [OBR]: 'bg-purple-700 text-white', '-': 'bg-gray-200 text-gray-600', N: 'bg-emerald-600 text-white', [H]: 'bg-red-600 text-white', [V]: 'bg-orange-600 text-white', 'ЗАК': 'bg-purple-700 text-white' };
const CATS = [V, H, P, V + H, V + P, H + P, V + H + P];
const FEATURES = { cal: false };   // вкладка «Отпуска»: поставьте true, чтобы вернуть
const ROLES = { uzk: 'УЗК', mpd: 'МПД', otk: 'ОТК' }, RN = Object.assign({ admin: 'Админ' }, ROLES);
const AVS = ['😀', '😎', '🤠', '👷', '🦊', '🐻', '🐯', '🦁', '🐸', '🐼', '🦉', '🚀', '⚙️', '🔧', '⭐', '🔥'];
// Бригады: день D(d) идёт по кругу Б,А,В,Г с 17.11.2026; ночь d→d+1 работает та же бригада, что была днём d-1
const BR = ['Б', 'А', 'В', 'Г'], ANCH = '2026-11-17';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const setStatus = (t, c) => { const b = $('sync-status'); b.textContent = t; b.className = 'text-xs px-2 py-1 rounded ' + c; };
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
let tt; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), 3500); };
const showErr = m => { const b = $('err-box'); b.style.display = m ? 'block' : 'none'; b.textContent = m || ''; };

// ===== Время смен (по Киеву) =====
const kNow = () => Date.parse(new Date().toLocaleString('sv-SE', { timeZone: 'Europe/Kyiv' }).replace(' ', 'T') + 'Z');
const dms = d => Date.parse(d + 'T00:00:00Z');
const addDays = (d, n) => new Date(dms(d) + n * 864e5).toISOString().slice(0, 10);
const endOf = (d, t) => dms(d) + (t === 'D' ? 19 : 31) * 36e5;
const live = (d, t) => kNow() < endOf(d, t) + 36e5;          // до 08:00 / 20:00 смена ещё «живая», потом — архив
const curKey = () => { const n = kNow(), h = new Date(n).getUTCHours(); return { date: new Date(n - 7 * 36e5).toISOString().slice(0, 10), type: h >= 7 && h < 19 ? 'D' : 'N' }; };
const letter = (d, t) => BR[((((dms(d) - dms(ANCH)) / 864e5 - (t === 'N' ? 1 : 0)) % 4) + 4) % 4];
const fd = d => d.split('-').reverse().join('.');
const fdn = d => { const e = addDays(d, 1); return d.slice(8) + '–' + e.slice(8) + '.' + e.slice(5, 7) + '.' + e.slice(0, 4); };
const sDate = s => s.shift_type === 'D' ? fd(s.shift_date) : fdn(s.shift_date);
const sTitle = s => (s.shift_type === 'D' ? '☀️ День' : '🌙 Ночь') + ' · ' + sDate(s) + ' · смена ' + letter(s.shift_date, s.shift_type);

// ===== Состояние =====
let db, ch, pipes = [], sorts = [], msgs = [], cur = null, view = null, grace = null, tab = 'list', unread = 0, tick = null;
const q = {}, lastEdit = {}; let touching = false, needR = false, tick2 = null, alertSt = null, alertTimer = null;
let ses = JSON.parse(localStorage.getItem('ses4') || '{}');
let cols = Object.assign({ uzk: 1, minus: 1, mpd: 1, curve: 0 }, JSON.parse(localStorage.getItem('cols') || '{}'));
let st = { step: 'ws', users: [], pick: null, av: AVS[0], nm: '', role: 'uzk' };
let arch = { from: addDays(curKey().date, -14), to: curKey().date, pl: '', letter: '', type: '', sort: 'date', rows: null, det: null, q: '' };
let theme = localStorage.getItem('theme') || 'auto';
const THN = { auto: '🌓', day: '☀️', night: '🌙' };
function applyTheme() {
  const night = theme === 'night' || (theme === 'auto' && curKey().type === 'N');
  document.body.classList.toggle('dark', night); $('theme').textContent = THN[theme];
  document.querySelector('meta[name=theme-color]').content = night ? '#0b1220' : '#1e293b'; applyLook();
}
const setTheme = t => { theme = t; localStorage.setItem('theme', t); applyTheme(); if (ses.uid && cur) render(true); };
const saveS = () => localStorage.setItem('ses4', JSON.stringify(ses));
const role = () => ses.role;
const uzkish = () => role() === 'uzk' || role() === 'admin';
const can = c => role() === 'admin' ? true : role() === 'uzk' ? (c === 'uzk' || c === 'minus' || c === 'curve') : role() === 'mpd' && (c === 'mpd1' || c === 'mpd2');

const modal = h => { $('modal').innerHTML = '<div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-2 max-h-[90vh] overflow-y-auto">' + h + '</div>'; $('modal').classList.remove('hidden'); };
const closeM = () => $('modal').classList.add('hidden');
const mb = (act, txt, cls, extra) => `<button data-act="${act}" ${extra || ''} class="w-full py-3 font-bold text-lg rounded-xl ${cls}">${txt}</button>`;
const card = (t, h) => `<div class="bg-white rounded-xl p-4 shadow-sm space-y-2"><h2 class="font-bold text-slate-700">${t}</h2>${h}</div>`;
const inp = (id, ph, ex) => `<input id="${id}" placeholder="${ph}" ${ex || ''} class="w-full border-2 p-3 rounded-lg">`;

// ===== Вход: пароль цеха → пользователь → роль (или администратор) =====
const ADMIN_UID = '00000000-0000-0000-0000-000000000001';
let lockModal = false;
async function loadUsers() { const { data } = await db.from('users').select('id,name,avatar,has_pin').order('name'); st.users = data || []; }
const admLink = () => mb('admform', '🛠 Вход для администратора', 'text-gray-500 !text-base');
function startUI(step) {
  st.step = step; $('app').classList.add('hidden'); $('nav').classList.add('hidden'); $('online').classList.add('hidden'); $('start').classList.remove('hidden'); $('hdr').textContent = 'Цех МПД / УЗК';
  let h = '';
  if (step === 'ws') h = (st.wsExists ? card('Пароль цеха', inp('w-pass', 'Пароль цеха', 'type="password"') + mb('ws', 'Продолжить', 'bg-blue-600 text-white'))
    : card('Пароль цеха ещё не задан', '<p class="text-sm text-gray-600">Его задаёт администратор: войдите как администратор ниже.</p>')) + admLink();
  if (step === 'users') h = card('Кто вы?', st.users.map(u => `<button data-act="pick" data-id="${u.id}" class="w-full py-3 px-3 text-left bg-gray-100 rounded-lg font-semibold">${esc(u.avatar)} ${esc(u.name)} ${u.has_pin ? '🔒' : ''}</button>`).join('') + mb('newuser', '➕ Новый пользователь', 'bg-blue-600 text-white')) + admLink();
  if (step === 'new') h = card('Новый пользователь', inp('n-name', 'Имя / ник', `value="${esc(st.nm)}" maxlength="30"`) +
    '<div class="grid grid-cols-8 gap-1">' + AVS.map(a => `<button data-act="av" data-a="${a}" class="text-2xl py-1 rounded ${a === st.av ? 'bg-blue-200' : ''}">${a}</button>`).join('') + '</div>' +
    mb('create', 'Создать', 'bg-blue-600 text-white') + mb('users', 'Назад', 'text-gray-500')) + admLink();
  if (step === 'role') h = card(esc(st.pick.avatar) + ' ' + esc(st.pick.name), (st.pick.has_pin ? inp('l-pin', 'Пароль учётки', 'type="password"') : '') +
    '<div class="grid grid-cols-3 gap-1 text-center font-semibold">' + Object.keys(ROLES).map(r => `<button data-act="role" data-r="${r}" class="py-3 rounded ${r === st.role ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}">${ROLES[r]}</button>`).join('') + '</div>' +
    mb('login', 'Войти', 'bg-emerald-600 text-white') + mb('users', 'Назад', 'text-gray-500'));
  if (step === 'adm') h = card('Администратор', inp('ad-login', 'Логин', 'value="admin" autocapitalize="none" autocomplete="off"') + inp('ad-pass', 'Пароль', 'type="password"') + mb('admlogin', 'Войти', 'bg-emerald-600 text-white') + mb('admback', 'Назад', 'text-gray-500'));
  $('start').innerHTML = h; applyLook();
}
async function startWs() { const { data } = await db.rpc('ws_exists'); st.wsExists = !!data; startUI('ws'); }
async function toUsers() { await loadUsers(); startUI(st.users.length ? 'users' : 'new'); }
async function doLogin() {
  if (st.pick.has_pin) {
    const { data, error } = await db.rpc('login_user', { p_id: st.pick.id, p_pin: $('l-pin').value });
    if (error) return toast(error.message); if (!data) return toast('Неверный пароль учётки');
  }
  ses = { ws: true, uid: st.pick.id, name: st.pick.name, avatar: st.pick.avatar, role: st.role, pin: st.pick.has_pin }; saveS(); enter();
}
async function doAdminLogin() {
  const pass = $('ad-pass').value;
  const { data, error } = await db.rpc('admin_login', { p_login: $('ad-login').value, p_pass: pass });
  if (error) return toast(error.message);
  if (!data || !data.length) return toast('Неверный логин или пароль');
  ses = { ws: true, uid: ADMIN_UID, name: 'Администратор', avatar: '🛠', role: 'admin', adm: data[0].tok }; saveS(); st.admOld = pass;
  await enter(); if (data[0].must) admForce();
}
function admForce() {
  lockModal = true;
  modal('<h3 class="font-bold text-center text-lg">Смените пароль администратора</h3><p class="text-sm text-gray-600">Пароль по умолчанию небезопасен. Минимум 4 символа, не «admin».</p>' + inp('af-new', 'Новый пароль', 'type="password"') + inp('af-new2', 'Повторите пароль', 'type="password"') + mb('admfirst', 'Сохранить', 'bg-blue-600 text-white'));
}
function wsModal() { modal('<h3 class="font-bold text-center text-lg">Пароль цеха</h3><p class="text-sm text-gray-600">Его будут вводить сотрудники при первом входе на телефоне. Минимум 4 символа.</p>' + inp('a-ws', 'Новый пароль цеха', 'type="password"') + mb('admws', 'Сохранить', 'bg-blue-600 text-white') + mb('close', 'Отмена', 'text-gray-500')); }
async function admRpc(fn, args) {
  const { data, error } = await db.rpc(fn, Object.assign({ p_token: ses.adm }, args));
  if (error) { toast(error.message); return false; }
  if (!data) { toast('Не удалось. Сессия администратора могла устареть — войдите заново'); return false; }
  return true;
}
function logout() { ses = { ws: true }; saveS(); stopRT(); closeM(); toUsers(); }

// ===== Вход в приложение =====
async function enter() {
  $('start').classList.add('hidden'); $('app').classList.remove('hidden'); $('nav').classList.remove('hidden'); $('online').classList.remove('hidden');
  $('hdr').textContent = `${ses.avatar} ${ses.name} · ${RN[ses.role]}`;
  tab = 'list'; unread = 0; startRT();
  try { const sn = JSON.parse(localStorage.getItem('snap') || 'null'), ms = JSON.parse(localStorage.getItem('msnap') || '[]');
    if (sn && sn.view && live(sn.view.shift_date, sn.view.shift_type)) { cur = sn.cur; view = sn.view; grace = sn.grace; pipes = sn.pipes; sorts = sn.sorts; msgs = ms; setTab(tab); } } catch (e) {}   // мгновенный показ из кэша
  await loadShift(); loadMsgs(); gamesLoad(); setTab(tab);
  clearInterval(tick); tick = setInterval(rollover, 30000);
  clearInterval(tick2); tick2 = setInterval(() => { if (ses.uid && view && !touching && !Object.keys(q).length && ['list', 'stat', 'sort'].includes(tab)) fetchAll(); }, 60000);
}
async function loadShift() {
  const { data, error } = await db.rpc('current_shift');
  if (error) { setStatus('Ошибка', 'bg-red-600'); return showErr(error.message); }
  cur = Array.isArray(data) ? data[0] : data;
  const { data: rs } = await db.from('shifts').select('*').order('shift_date', { ascending: false }).order('shift_type', { ascending: false }).limit(3);
  grace = (rs || []).find(s => s.id !== cur.id && live(s.shift_date, s.shift_type)) || null;
  if (!view || (view.id !== cur.id && !(grace && view.id === grace.id))) view = cur;
  await fetchAll();
}
function rollover() {
  applyTheme(); if (!cur) return; const k = curKey();
  if (cur.shift_date !== k.date || cur.shift_type !== k.type) { view = null; loadShift().then(() => { render(); toast('Новая смена: ' + sTitle(cur)); }); }
  else if (view && view.id !== cur.id && !live(view.shift_date, view.shift_type)) { view = cur; fetchAll(); }
}

// ===== Данные и реальное время =====
async function fetchAll() {
  const id = view.id;
  const [a, b] = await Promise.all([
    db.from('sortaments').select('*').eq('shift_id', id).order('created_at'),
    db.from('pipes').select('*').eq('shift_id', id).order('seq').order('created_at')]);
  const er = a.error || b.error;
  if (er) { setStatus('Ошибка загрузки', 'bg-red-600'); return showErr((er.code || '') + ' ' + er.message); }
  showErr(''); sorts = a.data; pipes = b.data; render();
  try { localStorage.setItem('snap', JSON.stringify({ cur, view, grace, pipes, sorts })); } catch (e) {}
}
async function loadMsgs() {
  const { data } = await db.from('messages').select('*').order('created_at', { ascending: false }).limit(100);
  msgs = (data || []).reverse(); if (tab === 'chat') rChat();
  try { localStorage.setItem('msnap', JSON.stringify(msgs.slice(-40))); } catch (e) {}
}
function startRT() {
  stopRT();
  const up = (arr, row) => { const i = arr.findIndex(x => x.id === row.id); i >= 0 ? arr[i] = row : arr.push(row); };
  ch = db.channel('mpd_ch', { config: { presence: { key: ses.uid } } })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pipes' }, p => {
      if (!view) return;
      if (p.eventType === 'DELETE') { pipes = pipes.filter(x => x.id !== p.old.id); return render(); }
      if (p.new.shift_id !== view.id) return;
      const id = p.new.id, had = pipes.some(x => x.id === id);
      if (p.eventType === 'UPDATE' && had && (q[id] || Date.now() - (lastEdit[id] || 0) < 2500)) return;   // эхо наших же правок не трогаем
      up(pipes, p.new); pipes.sort((a, b) => a.seq - b.seq || a.created_at.localeCompare(b.created_at));
      if (p.eventType === 'UPDATE' && had) updRow(id, true); else render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sortaments' }, p => {
      if (!view) return;
      if (p.eventType === 'DELETE') { sorts = sorts.filter(x => x.id !== p.old.id); pipes = pipes.filter(x => x.sort_id !== p.old.id); }
      else if (p.new.shift_id === view.id) up(sorts, p.new);
      render();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
      if (msgs.some(m => m.id === p.new.id)) return; msgs.push(p.new);
      if (tab === 'chat') rChat(); else if (p.new.user_id !== ses.uid) { unread++; navUpd(); buzz(30); }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'games' }, gameEvt)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'absences' }, p => {
      const r = p.eventType === 'DELETE' ? p.old : p.new; cal.abs = cal.abs.filter(a => !(a.user_id === r.user_id && a.day === r.day));
      if (p.eventType !== 'DELETE') cal.abs.push(p.new); if (tab === 'cal' && !paint) rCal(true);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'day_notes' }, () => { cal.fresh = false; if (tab === 'cal' && !paint) calLoad(); })
    .on('presence', { event: 'sync' }, () => { const n = Object.keys(ch.presenceState()).length; $('online').textContent = '👥 ' + n; if (tab === 'games' && !openG) rGames(); })
    .subscribe(async s => {
      if (s === 'SUBSCRIBED') { setStatus('Онлайн', 'bg-emerald-600'); await ch.track({ uid: ses.uid, name: ses.name, avatar: ses.avatar, role: ses.role }); if (view) fetchAll(); }

function expand(txt) {
  const out = [];
  txt.toUpperCase().replace(/\s*[-–—]\s*/g, '-').split(/[\s,;]+/).filter(Boolean).forEach(t => {
    const m = t.match(/^(\D*)(\d+)-(\D*)(\d+)$/);
    if (m && (m[3] === '' || m[3] === m[1])) { const a = +m[2], b = +m[4], w = m[2].length; if (b > a && b - a <= 500) { for (let i = a; i <= b; i++) out.push(m[1] + String(i).padStart(w, '0')); return; } }
    out.push(t);
  });
  return [...new Set(out)];
}

// ===== Отчёт =====
function statOf(arr, s) {
  let bad = 0, both = 0, minus = 0, curved = 0, rp = 0, pb = 0; const cat = {};
  arr.forEach(p => { const l = p.uzk_def !== 'N', m = p.uzk_minus != null; if (p.curved) curved++; if (p.kind === 'rep') rp++; if (p.kind === 'probe') pb++; if (l || m) bad++; if (l && m) both++; else if (l) cat[p.uzk_def] = (cat[p.uzk_def] || 0) + 1; else if (m) minus++; });
  const n = arr.length, good = n - bad, parts = CATS.filter(k => cat[k]).map(k => k + ' ' + cat[k]); parts.push('S- ' + minus);
  return [`${s.diameter} x ${s.wall} ${s.grade || ''}`.trim(), `Подано - ${n}${rp || pb ? ` (повторов ${rp}, проб ${pb})` : ''}`, `Отсортов - ${bad}`, `Годных - ${good} (${n ? Math.round(good / n * 100) : 0}%)`, parts.join(', '), `Совместных - ${both};`]
    .concat(cols.curve ? [`Кривых - ${curved};`] : []).join('\n');
}
function reportOf(sh, arr, info) {
  const g = new Map(); arr.forEach(p => { if (!g.has(p.sort_id)) g.set(p.sort_id, [info(p), []]); g.get(p.sort_id)[1].push(p); });
  const blocks = [...g.values()].map(([s, a]) => statOf(a, s || { diameter: '?', wall: '?' }));
  if (g.size > 1) blocks.push(statOf(arr, { diameter: 'Итого', wall: '', grade: '' }).replace(/^Итого x\s*/, 'Итого за смену\n'));
  return `КНК за смену ${letter(sh.shift_date, sh.shift_type)} · ${sDate(sh)} ${sh.shift_type === 'D' ? '(день)' : '(ночь)'}:\n` + blocks.join('\n\n');
}

async function shrink(file, max, q) {
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', q));
}

function botReply(raw) {
  const t = raw.toLowerCase().replace(/^\s*@?(бот|трубоша)[\s,:!.\-]*/, '').replace(/@(бот|трубоша)/g, ''), has = (...w) => w.some(x => t.includes(x));
  if (!t.trim() || has('привет', 'здравств', 'хай', 'добр')) return pick(['Привет! Я Трубоша 🤖 — про трубы, смены и немного сарказма. Напиши «помощь» 🔧', 'На связи Трубоша! Дефектов не вижу, но это пока 😏 Спроси «помощь»']);
  if (has('помощ', 'умеешь', 'команд', 'help')) return 'Умею: «смена» 👷, «статистика» 📊, «тревога» 🚨, «онлайн» 👥, «время» ⏰, «анекдот» 😄 и объясняю термины: УЗК, МПД, ЗАК, минус, ОТК, повтор/проба 🔧 Остальное — к начальству 😉';
  if (has('смен', 'бригад', 'кто работ')) {
    const k = curKey(); let d = k.date, ty = k.type; const ls = [];
    for (let i = 0; i < 4; i++) { ls.push(`${ty === 'D' ? '☀️' : '🌙'} ${letter(d, ty)}`); if (ty === 'D') ty = 'N'; else { ty = 'D'; d = addDays(d, 1); } }
    return `Сейчас ${k.type === 'D' ? 'день' : 'ночь'}: работает смена ${ls[0].slice(3)} 👷 Дальше: ${ls.slice(1).join(' → ')} 🗓️`;
  }
  if (has('статист', 'подано', 'сколько', 'брак', 'годн')) {
    if (!pipes.length) return 'В списке пока пусто — работы нет, можно выдохнуть ☕';
    const n = pipes.length, bad = pipes.filter(p => p.uzk_def !== 'N' || p.uzk_minus != null).length, pc = Math.round((n - bad) / n * 100);
    return `Подано ${n}, отсорт ${bad}, годных ${n - bad} (${pc}%) 📊 ${pc >= 90 ? 'Красота, ОТК аплодирует 👏' : pc >= 75 ? 'Нормально, но можно лучше 🤔' : 'Ого, трубы сегодня с характером 😬'}`;

    case 'wp': if (d.v === 'photo' && !localStorage.getItem('wpimg')) return toast('Сначала выберите фото кнопкой ниже'); look.wp = d.v; saveLook(); applyLook(); return rSet();
    case 'gpick': return modal('<h3 class="font-bold text-center text-lg">Во что играем с ' + esc(d.n) + '?</h3>' + mb('gsend', GN.ttt, 'bg-blue-600 text-white', `data-k="ttt" data-u="${d.u}" data-n="${esc(d.n)}"`) + mb('gsend', GN.bs, 'bg-blue-600 text-white', `data-k="bs" data-u="${d.u}" data-n="${esc(d.n)}"`) + mb('close', 'Отмена', 'text-gray-500'));
    case 'gsend': closeM(); return gCreate(d.k, d.u, d.n);
    case 'gopen': openG = d.id; return rGames();
    case 'gback': openG = null; return rGames();
    case 'gacc': { const g = games.find(x => x.id === d.id); closeM(); if (!g) return; const { data } = await db.from('games').update({ status: 'playing', ver: g.ver + 1 }).eq('id', g.id).eq('ver', g.ver).select(); if (data && data[0]) Object.assign(g, data[0]); openG = g.id; setTab('games'); return; }
    case 'gdec': { const g = games.find(x => x.id === d.id); closeM(); if (g) await db.from('games').update({ status: 'declined', ver: g.ver + 1 }).eq('id', g.id); return; }
    case 'gcell': {
      const g = curGame(); if (!g || !myTurn(g)) return; const i = +d.i, b = g.state.b.slice(); if (b[i]) return; const me = meP(g); b[i] = me === 1 ? 'X' : 'O';
      const win = TL.some(l => l.every(k => b[k] === b[i])), full = b.every(Boolean); return gMove(g, { b, turn: me === 1 ? 2 : 1, w: win ? me : full ? 0 : undefined }, win || full ? 'done' : undefined);
    }
    case 'bshot': {
      const g = curGame(); if (!g || !myTurn(g)) return; const me = meP(g), st = g.state, opp = me === 1 ? st.s2 : st.s1, key = me === 1 ? 'h1' : 'h2', i = +d.i; if (st[key][i] === '1') return;
      const nsh = st[key].slice(0, i) + '1' + st[key].slice(i + 1), hit = opp[i] > 0, ns = Object.assign({}, st, { [key]: nsh });
      if (hit && opp.every((x, k) => x === 0 || nsh[k] === '1')) { ns.w = me; return gMove(g, ns, 'done'); }
      if (hit) { if (opp.every((x, k) => x !== opp[i] || nsh[k] === '1')) toast('Потопил! 🚢💥'); } else ns.turn = me === 1 ? 2 : 1;
      return gMove(g, ns);
    }
    case 'cmode': cal.mode = d.v; return rCal(true);
    case 'ckind': cal.kind = d.v; return rCal(true);
    case 'cprev': case 'cnext': { const [y, m] = cal.m.split('-').map(Number), n = new Date(Date.UTC(y, m - 1 + (d.act === 'cnext' ? 1 : -1), 1)); cal.m = n.toISOString().slice(0, 7); cal.fresh = false; return rCal(); }
    case 'nsend': {
      const text = $('n-text').value.trim(); if (!text && !cal.file) return; let photo = null;
      if (cal.file) { try { const blob = await shrink(cal.file, 1000, .72), path = `${cal.day}/${crypto.randomUUID()}.jpg`; const { error } = await db.storage.from('daynotes').upload(path, blob, { contentType: 'image/jpeg' }); if (error) return toast('Фото не загрузилось: ' + error.message); photo = path; } catch (er) { return toast('Не удалось обработать фото'); } }
      const { error } = await db.from('day_notes').insert({ day: cal.day, user_id: ses.uid, name: ses.name, avatar: ses.avatar, text, photo }); if (error) return toast(error.message);
      cal.notes[cal.day] = (cal.notes[cal.day] || 0) + 1; rCal(true); return calDay(cal.day);
    }
    case 'ndel': { await db.from('day_notes').delete().eq('id', d.id); if (d.p) db.storage.from('daynotes').remove([d.p]); cal.notes[cal.day] = Math.max(0, (cal.notes[cal.day] || 1) - 1); rCal(true); return calDay(cal.day); }
    case 'admform': return startUI('adm');
    case 'admback': return ses.ws ? toUsers() : startWs();
    case 'admlogin': return doAdminLogin();
    case 'admfirst': {
      const a = $('af-new').value; if (a.length < 4 || a === 'admin') return toast('Минимум 4 символа и не «admin»'); if (a !== $('af-new2').value) return toast('Пароли не совпадают');
      const { data, error } = await db.rpc('admin_set_pass', { p_old: st.admOld, p_new: a }); if (error) return toast(error.message); if (!data) return toast('Не удалось сменить пароль');
      lockModal = false; closeM(); toast('Пароль администратора изменён'); const { data: ex } = await db.rpc('ws_exists'); if (!ex) wsModal(); return;
    }
    case 'admwsform': return wsModal();
    case 'admws': { if (await admRpc('admin_ws_set', { p_new: $('a-ws').value })) { closeM(); toast('Пароль цеха сохранён'); if (tab === 'admin') rAdmin(); } return; }
    case 'admpass': { const { data, error } = await db.rpc('admin_set_pass', { p_old: $('ap-old').value, p_new: $('ap-new').value }); if (error) return toast(error.message); return toast(data ? 'Пароль администратора изменён' : 'Неверный текущий пароль или новый слишком простой'); }
    case 'admdel': { if (!confirm('Удалить эту учётную запись?')) return; if (await admRpc('admin_delete_user', { p_id: d.id })) { toast('Учётная запись удалена'); rAdmin(); } return; }
    case 'admreset': { if (await admRpc('admin_reset_pin', { p_id: d.id })) { toast('Пароль учётки сброшен'); rAdmin(); } return; }
    case 'admclear': { if (!confirm('Удалить всю переписку в чате?')) return; if (await admRpc('admin_clear_chat', {})) { msgs = []; toast('Чат очищен'); } return; }
    case 'delme': return modal('<h3 class="font-bold text-center text-lg">Удалить учётную запись «' + esc(ses.name) + '»?</h3><p class="text-sm text-gray-600">Действие необратимо. Ваши сообщения в чате останутся.</p>' + (ses.pin ? inp('d-pin', 'Пароль учётки', 'type="password"') : '') + mb('delmego', 'Удалить навсегда', 'bg-red-600 text-white') + mb('close', 'Отмена', 'text-gray-500'));
    case 'delmego': { const { data, error } = await db.rpc('delete_user', { p_id: ses.uid, p_pin: $('d-pin') ? $('d-pin').value : '' }); if (error) return toast(error.message); if (!data) return toast('Неверный пароль учётки'); closeM(); toast('Учётная запись удалена'); return logout(); }
    case 'newuser': st.nm = ''; return startUI('new');
    case 'av': st.nm = $('n-name').value; st.av = d.a; return startUI('new');
    case 'create': { const name = $('n-name').value.trim(); if (name.length < 2) return toast('Имя — минимум 2 символа'); const { data, error } = await db.rpc('register_user', { p_name: name, p_avatar: st.av }); if (error) return toast(/name_taken/.test(error.message) ? 'Такое имя уже есть' : error.message); st.pick = { id: data, name, avatar: st.av, has_pin: false }; return startUI('role'); }
    case 'pick': st.pick = st.users.find(u => u.id === d.id); return startUI('role');
    case 'role': st.role = d.r; { const pin = $('l-pin') && $('l-pin').value; startUI('role'); if (pin) $('l-pin').value = pin; return; }
    case 'login': return doLogin();
    case 'logout': return logout();
    case 'theme': return setTheme({ auto: 'day', day: 'night', night: 'auto' }[theme]);
    case 'themeset': return setTheme(d.v);
    case 'online': return onlineModal();
    case 'vs': view = d.id === cur.id ? cur : grace; return fetchAll();
    case 'close': if (lockModal) return; return closeM();
    case 'alertx': return hideAlert();
    case 'alerttest': return showAlert('', true);
    case 'mpdset': setMpd(d.id, d.c, d.v); return closeM();
    case 'uzkt': { const p = pipes.find(x => x.id === d.id), c0 = p.uzk_def === 'N' ? '' : p.uzk_def, nw = L.filter(l => c0.includes(l) !== (l === d.l)).join(''); await setUzk(d.id, { uzk_def: nw || 'N' }); return uzkModal(d.id); }
    case 'uzkset': setUzk(d.id, { uzk_def: 'N' }); return closeM();
    case 'minsave': { const v = parseFloat($('m-val').value.replace(',', '.')); if (!(v > 0)) return toast('Введите толщину числом'); setUzk(d.id, { uzk_minus: v }); return closeM(); }
    case 'minreset': setUzk(d.id, { uzk_minus: null }); return closeM();
    case 'edel': { if (!confirm('Удалить трубу? Нумерация ниже сдвинется.')) return; closeM(); const { error } = await db.rpc('delete_pipe', { p_id: d.id }); if (error) return toast(error.message); return fetchAll(); }
    case 'sortform': return sortForm(d.next);
    case 'sortsave': return sortSave();
    case 'sortdel': { if (!confirm('Удалить сортамент вместе со всеми его трубами?')) return; const { error } = await db.rpc('delete_sortament', { p_id: d.id }); if (error) return toast(error.message); return fetchAll(); }
    case 'share': return share(reportText(), false);
    case 'copy': return share(reportText(), true);
    case 'af': readArch(); arch[d.k] = d.v; return rArch();
    case 'aload': return archLoad();
    case 'aopen': return archOpen(d.id, d.d, d.t);
    case 'aback': arch.det = null; return rArch();
    case 'ashare': return share(reportOf(arch.det.sh, arch.det.rows, p => p.sortaments), false);
    case 'send': return sendMsg();
    case 'pin': return pinModal();
    case 'pinsave': { const { data, error } = await db.rpc('set_pin', { p_id: ses.uid, p_new: $('p-new').value, p_old: $('p-old') ? $('p-old').value : '' }); if (error) return toast(error.message); if (!data) return toast('Неверный текущий пароль'); ses.pin = !!$('p-new').value; saveS(); closeM(); toast(ses.pin ? 'Пароль установлен' : 'Пароль убран'); return render(true); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'chat-in') sendMsg(); });
$('modal').addEventListener('click', e => { if (e.target.id === 'modal' && !lockModal) closeM(); });

// ===== Старт =====
function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  applyTheme();
  const c = window.APP_CONFIG || {};
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(c.url || '') || (c.key || '').length < 20) { setStatus('Нет ключей', 'bg-red-600'); return; }
  db = window.supabase.createClient(c.url, c.key);
  setStatus('Готово', 'bg-emerald-600');
  alertInit();
  window.addEventListener('resize', layoutVars);
  window.addEventListener('pagehide', flushAll); document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
  if (ses.uid) enter(); else if (ses.ws) toUsers(); else startWs();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ses.uid && cur) { rollover(); fetchAll(); loadMsgs(); } });
  window.addEventListener('online', () => { if (ses.uid && view) fetchAll(); });
}
try { init(); } catch (e) { setStatus('ОШИБКА', 'bg-red-600'); showErr(e.message); }
</script>
</body>

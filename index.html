<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Контроль МПД / УЗК</title>
<script>
  window.addEventListener('error', function (e) {
    var b = document.getElementById('sync-status');
    if (b) { b.textContent = 'ОШИБКА СКРИПТА'; b.className = 'text-xs px-2 py-1 bg-red-600 rounded'; }
    var m = document.getElementById('err-box');
    if (m) { m.style.display = 'block'; m.textContent = (e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''); }
  });
</script>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; padding-bottom: 72px; }
  input, textarea, select { -webkit-user-select: text; user-select: text; }
</style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
<header class="bg-slate-800 text-white p-3 sticky top-0 z-10 shadow-md flex justify-between items-center gap-2">
  <h1 class="font-bold text-base truncate" id="hdr">Цех МПД / УЗК</h1>
  <div class="flex items-center gap-2 shrink-0">
    <button id="online" data-act="online" class="hidden text-xs px-2 py-1 bg-slate-600 rounded">👥 0</button>
    <span id="sync-status" class="text-xs px-2 py-1 bg-yellow-600 rounded">Подключение...</span>
  </div>
</header>
<div id="err-box" style="display:none" class="m-3 p-3 bg-red-100 text-red-800 text-sm rounded break-all"></div>
<section id="start" class="hidden p-3 max-w-md mx-auto space-y-3"></section>
<main id="app" class="hidden p-2 max-w-md mx-auto">
  <div id="v-list" class="space-y-2"></div><div id="v-otk" class="hidden space-y-3"></div><div id="v-sort" class="hidden space-y-3"></div>
  <div id="v-stat" class="hidden space-y-3"></div><div id="v-arch" class="hidden space-y-3"></div><div id="v-chat" class="hidden"></div><div id="v-set" class="hidden space-y-3"></div>
</main>
<nav id="nav" class="hidden fixed bottom-0 inset-x-0 bg-slate-800 text-white flex overflow-x-auto text-[11px] text-center" style="padding-bottom:env(safe-area-inset-bottom,0)"></nav>
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end sm:items-center justify-center p-3"></div>
<div id="toast" class="hidden fixed bottom-20 inset-x-4 z-50 bg-slate-900 text-white text-sm p-3 rounded-lg text-center"></div>

<script>
// ===== Константы (В, Н, П — кириллица; N — латиница) =====
const V = '\u0412', H = '\u041d', P = '\u041f', L = [V, H, P];
const CY = ['-', 'N', H, V, 'ЗАК'];
const MC = { '-': 'bg-gray-200 text-gray-600', N: 'bg-emerald-600 text-white', [H]: 'bg-red-600 text-white', [V]: 'bg-orange-600 text-white', 'ЗАК': 'bg-purple-700 text-white' };
const CATS = [V, H, P, V + H, V + P, H + P, V + H + P];
const ROLES = { uzk: 'УЗК', mpd: 'МПД', otk: 'ОТК' };
const AVS = ['😀', '😎', '🤠', '👷', '🦊', '🐻', '🐯', '🦁', '🐸', '🐼', '🦉', '🚀', '⚙️', '🔧', '⭐', '🔥'];
const EMO = ['👍', '👌', '😂', '🙏', '⚠️', '✅', '❌', '🔧', '☕', '😀'];
// Бригады: день D(d) идёт по кругу Б,А,В,Г с 17.11.2026; ночь d→d+1 работает та же бригада, что была днём d-1
const BR = ['Б', 'А', 'В', 'Г'], ANCH = '2026-11-17';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const setStatus = (t, c) => { const b = $('sync-status'); b.textContent = t; b.className = 'text-xs px-2 py-1 rounded ' + c; };
const hhmm = iso => iso ? new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';
let tt; const toast = m => { const t = $('toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), 3500); };
const showErr = m => { const b = $('err-box'); b.style.display = m ? 'block' : 'none'; b.textContent = m || ''; };

// ===== Время смен (по Киеву) =====
const kNow = () => Date.parse(new Date().toLocaleString('sv-SE', { timeZone: 'Europe/Kyiv' }).replace(' ', 'T') + 'Z');
const dms = d => Date.parse(d + 'T00:00:00Z');
const addDays = (d, n) => new Date(dms(d) + n * 864e5).toISOString().slice(0, 10);
const endOf = (d, t) => dms(d) + (t === 'D' ? 19 : 31) * 36e5;
const live = (d, t) => kNow() < endOf(d, t) + 36e5;          // до 08:00 / 20:00 смена ещё «живая», потом — архив
const curKey = () => { const n = kNow(), h = new Date(n).getUTCHours(); return { date: new Date(n - 7 * 36e5).toISOString().slice(0, 10), type: h >= 7 && h < 19 ? 'D' : 'N' }; };
const letter = (d, t) => BR[((((dms(d) - dms(ANCH)) / 864e5 - (t === 'N' ? 1 : 0)) % 4) + 4) % 4];
const fd = d => d.split('-').reverse().join('.');
const fdn = d => { const e = addDays(d, 1); return d.slice(8) + '–' + e.slice(8) + '.' + e.slice(5, 7) + '.' + e.slice(0, 4); };
const sDate = s => s.shift_type === 'D' ? fd(s.shift_date) : fdn(s.shift_date);
const sTitle = s => (s.shift_type === 'D' ? '☀️ День' : '🌙 Ночь') + ' · ' + sDate(s) + ' · смена ' + letter(s.shift_date, s.shift_type);

// ===== Состояние =====
let db, ch, pipes = [], sorts = [], msgs = [], cur = null, view = null, grace = null, tab = 'list', unread = 0, tick = null;
let ses = JSON.parse(localStorage.getItem('ses3') || '{}');
let cols = Object.assign({ uzk: 1, minus: 1, mpd: 1, curve: 0 }, JSON.parse(localStorage.getItem('cols') || '{}'));
let st = { step: 'ws', users: [], pick: null, av: AVS[0], nm: '', role: 'uzk' };
let arch = { from: addDays(curKey().date, -14), to: curKey().date, pl: '', letter: '', type: '', sort: 'date', rows: null, det: null, q: '' };
const saveS = () => localStorage.setItem('ses3', JSON.stringify(ses));
const role = () => ses.role;
const can = c => role() === 'uzk' || (role() === 'mpd' && c === 'mpd');

const modal = h => { $('modal').innerHTML = '<div class="bg-white w-full max-w-sm rounded-2xl p-4 space-y-2 max-h-[90vh] overflow-y-auto">' + h + '</div>'; $('modal').classList.remove('hidden'); };
const closeM = () => $('modal').classList.add('hidden');
const mb = (act, txt, cls, extra) => `<button data-act="${act}" ${extra || ''} class="w-full py-3 font-bold text-lg rounded-xl ${cls}">${txt}</button>`;
const card = (t, h) => `<div class="bg-white rounded-xl p-4 shadow-sm space-y-2"><h2 class="font-bold text-slate-700">${t}</h2>${h}</div>`;
const inp = (id, ph, ex) => `<input id="${id}" placeholder="${ph}" ${ex || ''} class="w-full border-2 p-3 rounded-lg">`;

// ===== Вход: пароль цеха → пользователь → роль =====
async function loadUsers() { const { data } = await db.from('users').select('id,name,avatar,has_pin').order('name'); st.users = data || []; }
function startUI(step) {
  st.step = step; $('app').classList.add('hidden'); $('nav').classList.add('hidden'); $('online').classList.add('hidden'); $('start').classList.remove('hidden'); $('hdr').textContent = 'Цех МПД / УЗК';
  let h = '';
  if (step === 'ws') h = card('Пароль цеха', inp('w-pass', 'Пароль (если вы первый — он задастся)', 'type="password"') + mb('ws', 'Продолжить', 'bg-blue-600 text-white'));
  if (step === 'users') h = card('Кто вы?', st.users.map(u => `<button data-act="pick" data-id="${u.id}" class="w-full py-3 px-3 text-left bg-gray-100 rounded-lg font-semibold">${esc(u.avatar)} ${esc(u.name)} ${u.has_pin ? '🔒' : ''}</button>`).join('') + mb('newuser', '➕ Новый пользователь', 'bg-blue-600 text-white'));
  if (step === 'new') h = card('Новый пользователь', inp('n-name', 'Имя / ник', `value="${esc(st.nm)}" maxlength="30"`) +
    '<div class="grid grid-cols-8 gap-1">' + AVS.map(a => `<button data-act="av" data-a="${a}" class="text-2xl py-1 rounded ${a === st.av ? 'bg-blue-200' : ''}">${a}</button>`).join('') + '</div>' +
    mb('create', 'Создать', 'bg-blue-600 text-white') + mb('users', 'Назад', 'text-gray-500'));
  if (step === 'role') h = card(esc(st.pick.avatar) + ' ' + esc(st.pick.name), (st.pick.has_pin ? inp('l-pin', 'Пароль учётки', 'type="password"') : '') +
    '<div class="grid grid-cols-3 gap-1 text-center font-semibold">' + Object.keys(ROLES).map(r => `<button data-act="role" data-r="${r}" class="py-3 rounded ${r === st.role ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}">${ROLES[r]}</button>`).join('') + '</div>' +
    mb('login', 'Войти', 'bg-emerald-600 text-white') + mb('users', 'Назад', 'text-gray-500'));
  $('start').innerHTML = h;
}
async function toUsers() { await loadUsers(); startUI(st.users.length ? 'users' : 'new'); }
async function doLogin() {
  if (st.pick.has_pin) {
    const { data, error } = await db.rpc('login_user', { p_id: st.pick.id, p_pin: $('l-pin').value });
    if (error) return toast(error.message); if (!data) return toast('Неверный пароль учётки');
  }
  ses = { ws: true, uid: st.pick.id, name: st.pick.name, avatar: st.pick.avatar, role: st.role, pin: st.pick.has_pin }; saveS(); enter();
}
function logout() { ses = { ws: true }; saveS(); stopRT(); closeM(); toUsers(); }

// ===== Вход в приложение =====
async function enter() {
  $('start').classList.add('hidden'); $('app').classList.remove('hidden'); $('nav').classList.remove('hidden'); $('online').classList.remove('hidden');
  $('hdr').textContent = `${ses.avatar} ${ses.name} · ${ROLES[ses.role]}`;
  tab = ses.role === 'otk' ? 'otk' : 'list'; unread = 0; startRT(); await loadShift(); loadMsgs(); setTab(tab);
  clearInterval(tick); tick = setInterval(rollover, 30000);
}
async function loadShift() {
  const { data, error } = await db.rpc('current_shift');
  if (error) { setStatus('Ошибка', 'bg-red-600'); return showErr(error.message); }
  cur = Array.isArray(data) ? data[0] : data;
  const { data: rs } = await db.from('shifts').select('*').order('shift_date', { ascending: false }).order('shift_type', { ascending: false }).limit(3);
  grace = (rs || []).find(s => s.id !== cur.id && live(s.shift_date, s.shift_type)) || null;
  if (!view || (view.id !== cur.id && !(grace && view.id === grace.id))) view = cur;
  await fetchAll();
}
function rollover() {
  if (!cur) return; const k = curKey();
  if (cur.shift_date !== k.date || cur.shift_type !== k.type) { view = null; loadShift().then(() => { render(); toast('Новая смена: ' + sTitle(cur)); }); }
  else if (view && view.id !== cur.id && !live(view.shift_date, view.shift_type)) { view = cur; fetchAll(); }
}

// ===== Данные и реальное время =====
async function fetchAll() {
  const id = view.id;
  const [a, b] = await Promise.all([
    db.from('sortaments').select('*').eq('shift_id', id).order('created_at'),
    db.from('pipes').select('*').eq('shift_id', id).order('seq').order('created_at')]);
  const er = a.error || b.error;
  if (er) { setStatus('Ошибка загрузки', 'bg-red-600'); return showErr((er.code || '') + ' ' + er.message); }
  showErr(''); sorts = a.data; pipes = b.data; render();
}
async function loadMsgs() {
  const { data } = await db.from('messages').select('*').order('created_at', { ascending: false }).limit(100);
  msgs = (data || []).reverse(); if (tab === 'chat') rChat();
}
function startRT() {
  stopRT();
  const up = (arr, row) => { const i = arr.findIndex(x => x.id === row.id); i >= 0 ? arr[i] = row : arr.push(row); };
  ch = db.channel('mpd_ch', { config: { presence: { key: ses.uid } } })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'pipes' }, p => {
      if (!view) return;
      if (p.eventType === 'DELETE') pipes = pipes.filter(x => x.id !== p.old.id);
      else if (p.new.shift_id === view.id) { up(pipes, p.new); pipes.sort((a, b) => a.seq - b.seq || a.created_at.localeCompare(b.created_at)); }
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'sortaments' }, p => {
      if (!view) return;
      if (p.eventType === 'DELETE') { sorts = sorts.filter(x => x.id !== p.old.id); pipes = pipes.filter(x => x.sort_id !== p.old.id); }
      else if (p.new.shift_id === view.id) up(sorts, p.new);
      render();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => {
      if (msgs.some(m => m.id === p.new.id)) return; msgs.push(p.new);
      if (tab === 'chat') rChat(); else if (p.new.user_id !== ses.uid) { unread++; navUpd(); buzz(30); }
    })
    .on('presence', { event: 'sync' }, () => { const n = Object.keys(ch.presenceState()).length; $('online').textContent = '👥 ' + n; })
    .subscribe(async s => {
      if (s === 'SUBSCRIBED') { setStatus('Онлайн', 'bg-emerald-600'); await ch.track({ uid: ses.uid, name: ses.name, avatar: ses.avatar, role: ses.role }); if (view) fetchAll(); }
      else if (['CHANNEL_ERROR', 'TIMED_OUT', 'CLOSED'].includes(s)) setStatus('Нет связи', 'bg-red-600');
    });
}
function stopRT() { if (ch) { db.removeChannel(ch); ch = null; } clearInterval(tick); }
function onlineModal() {
  const ps = Object.values(ch ? ch.presenceState() : {}).map(a => a[0]).filter(Boolean);
  modal('<h3 class="font-bold text-center text-lg">Сейчас онлайн: ' + ps.length + '</h3>' + ps.map(u => `<div class="py-2 border-b">${esc(u.avatar)} <b>${esc(u.name)}</b> · ${ROLES[u.role] || ''}</div>`).join('') + mb('close', 'Закрыть', 'bg-slate-800 text-white'));
}
async function patch(id, obj, local) {
  const p = pipes.find(x => x.id === id); if (!p) return;
  const old = {}; Object.keys(obj).concat(Object.keys(local || {})).forEach(k => old[k] = p[k]);
  Object.assign(p, obj, local); render();
  const { error } = await db.from('pipes').update(obj).eq('id', id);
  if (error) { Object.assign(p, old); render(); toast('Не сохранилось: ' + error.message); buzz([100, 50, 100]); }
}
const setMpd = (id, v) => patch(id, { mpd_val: v, mpd_by: ses.name }, { mpd_at: v === '-' ? null : new Date().toISOString() });
const setUzk = (id, o) => patch(id, Object.assign({ uzk_by: ses.name }, o), { uzk_at: new Date().toISOString() });
const sortOf = id => sorts.find(s => s.id === id);

// ===== Вкладки =====
function tabsDef() {
  const r = role();
  return [['list', '📋', 'Список'], ['otk', '🔍', 'ОТК']].concat(r === 'uzk' ? [['sort', '➕', 'Сортамент']] : [])
    .concat(r !== 'mpd' ? [['stat', '📊', 'Отчёт'], ['arch', '🗄', 'Архив']] : []).concat([['chat', '💬', 'Чат'], ['set', '⚙️', 'Опции']]);
}
function navUpd() {
  $('nav').innerHTML = tabsDef().map(([k, i, n]) => `<button data-tab="${k}" class="py-2 flex-1 min-w-[58px] relative ${k === tab ? 'bg-blue-600 font-bold' : ''}"><div class="text-lg leading-none">${i}</div>${n}${k === 'chat' && unread ? `<span class="absolute top-0 right-2 bg-red-600 rounded-full px-1 text-[10px]">${unread}</span>` : ''}</button>`).join('');
}
function setTab(t) {
  tab = t; if (t === 'chat') unread = 0;
  ['list', 'otk', 'sort', 'stat', 'arch', 'chat', 'set'].forEach(x => $('v-' + x).classList.toggle('hidden', x !== t));
  navUpd(); render(true);
}
function render(force) {
  if (!view) return;
  if ((tab === 'arch' || tab === 'chat') && !force) return;
  ({ list: rList, otk: rOtk, sort: rSort, stat: rStat, arch: rArch, chat: rChat, set: rSet })[tab]();
}
function shiftBar() {
  const b = (s, l) => `<button data-act="vs" data-id="${s.id}" class="flex-1 py-2 rounded text-sm ${view.id === s.id ? 'bg-blue-600 text-white font-bold' : 'bg-gray-200'}">${l}</button>`;
  return `<div class="text-xs font-semibold text-slate-600 px-1">${sTitle(view)}</div>` + (grace ? `<div class="flex gap-1">${b(cur, 'Текущая')}${b(grace, 'Прошлая (доработка)')}</div>` : '');
}

// ===== Список =====
function cell(p, c, label, val, cls) {
  return `<button data-id="${p.id}" data-c="${c}" class="flex-1 h-14 rounded-lg flex flex-col items-center justify-center ${cls} ${can(c) ? 'active:scale-95' : 'opacity-60'}"><span class="text-[10px] opacity-80 font-normal leading-tight">${label}</span><span class="font-black text-lg leading-tight">${esc(val)}</span></button>`;
}
function rList() {
  let last = null, h = shiftBar();
  if (!pipes.length) h += '<p class="text-center text-gray-400 py-8">Список пуст' + (role() === 'uzk' ? '. Добавьте трубы во вкладке «Сортамент».' : '.') + '</p>';
  pipes.forEach(p => {
    if (p.sort_id !== last) {
      last = p.sort_id; const s = sortOf(p.sort_id);
      if (s) h += `<div class="text-xs text-slate-500 font-semibold px-1 pt-2">${esc(s.diameter)} x ${esc(s.wall)} ${esc(s.grade)}${s.plavka ? ' · пл. ' + esc(s.plavka) : ''}${s.party ? ' · парт. ' + esc(s.party) : ''}</div>`;
    }
    let b = '';
    if (cols.uzk) b += cell(p, 'uzk', 'УЗК', p.uzk_def, p.uzk_def === 'N' ? MC.N : 'bg-red-600 text-white');
    if (cols.minus) b += cell(p, 'minus', 'Минус', p.uzk_minus == null ? 'N' : p.uzk_minus, p.uzk_minus == null ? MC.N : 'bg-amber-500 text-white');
    if (cols.mpd) b += cell(p, 'mpd', 'МПД' + (p.mpd_at ? ' ' + hhmm(p.mpd_at) : ''), p.mpd_val, MC[p.mpd_val]);
    if (cols.curve) b += cell(p, 'curve', 'Кривая', p.curved ? 'К' : '—', p.curved ? 'bg-fuchsia-700 text-white' : 'bg-gray-200 text-gray-600');
    h += `<div class="bg-white p-2 rounded-xl shadow-sm border border-gray-200"><div class="flex items-center gap-2 mb-1"><span class="w-9 text-right font-bold text-slate-400">${p.seq}</span>
      <span data-edit="${p.id}" class="font-black text-xl text-slate-800 tracking-wide flex-1 break-all">${esc(p.pipe_number)}</span></div><div class="flex gap-1">${b}</div></div>`;
  });
  $('v-list').innerHTML = h;
}
let pt = null, lf = false; const lst = $('v-list');
lst.addEventListener('pointerdown', e => { const b = e.target.closest('button[data-id]'); if (!b) return; lf = false; pt = setTimeout(() => { lf = true; buzz(40); mpdModal(b.dataset.id, b.dataset.c); }, 500); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => lst.addEventListener(ev, () => clearTimeout(pt)));
lst.addEventListener('click', e => {
  const n = e.target.closest('[data-edit]'); if (n) { if (role() === 'uzk') editModal(n.dataset.edit); return; }
  const b = e.target.closest('button[data-id]'); if (!b || lf) return;
  const { id, c } = b.dataset, p = pipes.find(x => x.id === id); if (!p || !can(c)) return; buzz(20);
  if (c === 'mpd') { const i = CY.indexOf(p.mpd_val); setMpd(id, i >= 4 ? 'N' : CY[i + 1]); }
  else if (c === 'uzk') uzkModal(id); else if (c === 'minus') minusModal(id); else if (c === 'curve') patch(id, { curved: !p.curved });
});
function mpdModal(id, c) {
  if (c !== 'mpd' || !can(c)) return;
  const nm = { N: 'N — Годная', [H]: H + ' — Наружный', [V]: V + ' — Внутренний', 'ЗАК': 'ЗАК — Закалочная', '-': 'Сбросить (-)' };
  modal('<h3 class="font-bold text-center text-lg">Результат МПД</h3>' + CY.map(v => mb('mpdset', nm[v], MC[v], `data-id="${id}" data-v="${v}"`)).join('') + mb('close', 'Отмена', 'text-gray-500'));
}
function uzkModal(id) {
  const p = pipes.find(x => x.id === id); if (!p) return; const cur = p.uzk_def === 'N' ? '' : p.uzk_def;
  modal('<h3 class="font-bold text-center text-lg">Отсорт УЗК · №' + p.seq + '</h3><div class="grid grid-cols-3 gap-2">' +
    L.map(l => mb('uzkt', l, cur.includes(l) ? 'bg-red-600 text-white' : 'bg-gray-200 text-gray-700', `data-id="${id}" data-l="${l}"`)).join('') + '</div>' +
    mb('uzkset', 'N — годная', MC.N, `data-id="${id}"`) + mb('close', 'Готово', 'bg-slate-800 text-white'));
}
function minusModal(id) {
  const p = pipes.find(x => x.id === id); if (!p) return;

function expand(txt) {
  const out = [];
  txt.toUpperCase().replace(/\s*[-–—]\s*/g, '-').split(/[\s,;]+/).filter(Boolean).forEach(t => {
    const m = t.match(/^(\D*)(\d+)-(\D*)(\d+)$/);
    if (m && (m[3] === '' || m[3] === m[1])) { const a = +m[2], b = +m[4], w = m[2].length; if (b > a && b - a <= 500) { for (let i = a; i <= b; i++) out.push(m[1] + String(i).padStart(w, '0')); return; } }
    out.push(t);
  });
  return [...new Set(out)];
}
const sLabel = s => `${s.diameter} x ${s.wall} ${s.grade || ''}${s.plavka ? ' · пл. ' + s.plavka : ''}`;

// ===== Отчёт =====
function statOf(arr, s) {
  let bad = 0, both = 0, minus = 0, curved = 0; const cat = {};
  arr.forEach(p => { const l = p.uzk_def !== 'N', m = p.uzk_minus != null; if (p.curved) curved++; if (l || m) bad++; if (l && m) both++; else if (l) cat[p.uzk_def] = (cat[p.uzk_def] || 0) + 1; else if (m) minus++; });
  const n = arr.length, good = n - bad, parts = CATS.filter(k => cat[k]).map(k => k + ' ' + cat[k]); parts.push('S- ' + minus);
  return [`${s.diameter} x ${s.wall} ${s.grade || ''}`.trim(), `Подано - ${n}`, `Отсортов - ${bad}`, `Годных - ${good} (${n ? Math.round(good / n * 100) : 0}%)`, parts.join(', '), `Совместных - ${both};`]
    .concat(cols.curve ? [`Кривых - ${curved};`] : []).join('\n');
}
function reportOf(sh, arr, info) {
  const g = new Map(); arr.forEach(p => { if (!g.has(p.sort_id)) g.set(p.sort_id, [info(p), []]); g.get(p.sort_id)[1].push(p); });
  const blocks = [...g.values()].map(([s, a]) => statOf(a, s || { diameter: '?', wall: '?' }));
  if (g.size > 1) blocks.push(statOf(arr, { diameter: 'Итого', wall: '', grade: '' }).replace(/^Итого x\s*/, 'Итого за смену\n'));
  return `КНК за смену ${letter(sh.shift_date, sh.shift_type)} · ${sDate(sh)} ${sh.shift_type === 'D' ? '(день)' : '(ночь)'}:\n` + blocks.join('\n\n');
}

async function share(t, copyOnly) {

  try { await navigator.clipboard.writeText(t); toast('Скопировано'); } catch (e) { toast('Не удалось скопировать'); }
}

    const ks = Object.keys(g).sort(), mt = Math.max(...ks.map(k => g[k].t), 0), mp = Math.max(...ks.map(k => pct(g[k].b, g[k].t)), 0);

    case 'share': return share(reportText(), false);
    case 'copy': return share(reportText(), true);
    case 'af': readArch(); arch[d.k] = d.v; return rArch();
    case 'aload': return archLoad();
    case 'aopen': return archOpen(d.id, d.d, d.t);
    case 'aback': arch.det = null; return rArch();
    case 'ashare': return share(reportOf(arch.det.sh, arch.det.rows, p => p.sortaments), false);
    case 'emo': $('chat-in').value += d.e; return $('chat-in').focus();
    case 'send': return sendMsg();
    case 'pin': return pinModal();
    case 'pinsave': { const { data, error } = await db.rpc('set_pin', { p_id: ses.uid, p_new: $('p-new').value, p_old: $('p-old') ? $('p-old').value : '' }); if (error) return toast(error.message); if (!data) return toast('Неверный текущий пароль'); ses.pin = !!$('p-new').value; saveS(); closeM(); toast(ses.pin ? 'Пароль установлен' : 'Пароль убран'); return render(true); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'chat-in') sendMsg(); });
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeM(); });

// ===== Старт =====
function init() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  const c = window.APP_CONFIG || {};
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(c.url || '') || (c.key || '').length < 20) { setStatus('Нет ключей', 'bg-red-600'); return; }
  db = window.supabase.createClient(c.url, c.key);
  setStatus('Готово', 'bg-emerald-600');
  if (ses.uid) enter(); else if (ses.ws) toUsers(); else startUI('ws');
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ses.uid && cur) { rollover(); fetchAll(); loadMsgs(); } });
  window.addEventListener('online', () => { if (ses.uid && view) fetchAll(); });
}
try { init(); } catch (e) { setStatus('ОШИБКА', 'bg-red-600'); showErr(e.message); }
</script>
